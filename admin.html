<!DOCTYPE html>
<html lang="vi">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Quản Lý Whitelist Locket Gold | CAO VĂN NAM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg-color: #e8f4fc;
      --card-bg: rgba(255, 255, 255, 0.55);
      --text-main: #1e293b;
      --text-muted: #475569;
      --primary: #009fe8;
      --primary-hover: #0072bc;
      --bell-yellow: #ffcc00;
      --success: #10b981;
      --danger: #ff334b;
      --border-radius: 24px;
      --glass-border: 2px solid rgba(255, 255, 255, 0.85);
      --glass-shadow: 0 12px 35px rgba(0, 159, 232, 0.15), inset 0 0 20px rgba(255, 255, 255, 0.6);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: var(--bg-color);
      padding: 25px 15px;
      color: var(--text-main);
      position: relative;
      overflow-x: hidden;
    }

    .bg-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: url('/img/background-hero.webp');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      opacity: 0.85;
      z-index: 0;
      pointer-events: none;
    }

    .bg-gradient-glow {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(180deg, rgba(232, 244, 252, 0.7) 0%, rgba(186, 230, 253, 0.5) 50%, rgba(232, 244, 252, 0.8) 100%);
      z-index: 0;
      pointer-events: none;
    }

    .admin-header {
      text-align: center;
      margin-bottom: 25px;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header-logo-container {
      position: relative;
      margin-bottom: 12px;
    }

    .header-logo {
      width: 80px;
      height: 80px;
      border-radius: 24px;
      object-fit: cover;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.45), rgba(253, 224, 71, 0.35));
      backdrop-filter: blur(16px);
      box-shadow: 0 15px 35px rgba(0, 159, 232, 0.3), inset 0 0 20px rgba(255, 255, 255, 0.8);
      border: 3.5px solid #ffffff;
      outline: 2px solid rgba(255, 255, 255, 0.6);
    }

    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, rgba(0, 159, 232, 0.8), rgba(0, 114, 188, 0.9));
      backdrop-filter: blur(12px);
      color: #ffffff;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 8px;
      box-shadow: 0 8px 25px rgba(0, 159, 232, 0.35);
      border: 2px solid #ffffff;
    }

    .admin-title {
      font-size: 22px;
      font-weight: 800;
      background: linear-gradient(135deg, #0072bc, #009fe8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .container, .list-container {
      background-color: var(--card-bg);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      padding: 26px 20px;
      border-radius: var(--border-radius);
      box-shadow: var(--glass-shadow);
      border: var(--glass-border);
      width: 100%;
      max-width: 520px;
      box-sizing: border-box;
      margin-bottom: 25px;
      position: relative;
      z-index: 1;
    }

    h2 {
      margin-top: 0;
      font-size: 19px;
      font-weight: 800;
      color: #0072bc;
      text-align: center;
      margin-bottom: 18px;
    }

    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.7);
      border: 1.5px solid #ffffff;
      border-radius: 16px;
      padding: 12px 8px;
      text-align: center;
      box-shadow: 0 4px 14px rgba(0, 159, 232, 0.08);
    }

    .stat-number {
      font-size: 20px;
      font-weight: 800;
      color: #0072bc;
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 700;
      margin-top: 2px;
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      font-size: 14px;
      border: 2px solid rgba(255, 255, 255, 0.85);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(8px);
      color: var(--text-main);
      font-weight: 700;
      outline: none;
      transition: all 0.3s ease;
    }

    input:focus {
      border-color: var(--primary);
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 0 0 4px rgba(0, 159, 232, 0.25);
    }

    button {
      padding: 14px 18px;
      font-size: 14px;
      font-weight: 800;
      color: #fff;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.25s ease;
      letter-spacing: 0.3px;
    }

    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.7; cursor: not-allowed; }

    .btn-primary {
      background: linear-gradient(135deg, rgba(0, 159, 232, 0.85), rgba(0, 114, 188, 0.95));
      backdrop-filter: blur(12px);
      border: 2px solid #ffffff;
      box-shadow: 0 8px 25px rgba(0, 159, 232, 0.35);
      width: 100%;
    }

    .btn-primary:hover:not(:disabled) {
      box-shadow: 0 12px 30px rgba(0, 159, 232, 0.45);
      transform: translateY(-2px);
    }

    .btn-success { background: linear-gradient(135deg, #10b981, #059669); border: 1.5px solid #fff; }
    .btn-danger { background: linear-gradient(135deg, var(--danger), #e11d48); border: 1.5px solid #fff; }

    .whitelist-item {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(12px);
      border: 2px solid #ffffff;
      border-left: 6px solid var(--primary);
      border-radius: 18px;
      padding: 14px 16px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 6px 20px rgba(0, 159, 232, 0.08);
      transition: all 0.25s ease;
    }

    .whitelist-item.activated {
      border-left-color: var(--success);
    }

    .item-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .user-info-col {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-avatar-mini {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--bell-yellow);
      background: #cbd5e1;
    }

    .user-name-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--text-main);
    }

    .user-username-tag {
      font-size: 12px;
      color: #0072bc;
      font-weight: 700;
    }

    .badge-status {
      font-size: 11px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 20px;
    }

    .badge-pending {
      background: rgba(245, 158, 11, 0.15);
      color: #b45309;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .badge-activated {
      background: rgba(16, 185, 129, 0.15);
      color: #047857;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .item-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--text-muted);
      border-top: 1px dashed rgba(0, 159, 232, 0.2);
      padding-top: 8px;
    }

    .item-actions {
      display: flex;
      gap: 6px;
    }

    .btn-xs {
      padding: 6px 12px;
      font-size: 11px;
      border-radius: 10px;
    }

    .nav-links {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      width: 100%;
      max-width: 520px;
    }

    .nav-btn {
      flex: 1;
      padding: 12px;
      text-align: center;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.65);
      border: 1.5px solid #ffffff;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 800;
      color: #0072bc;
      box-shadow: 0 4px 14px rgba(0, 159, 232, 0.1);
      transition: all 0.2s ease;
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.95);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="bg-overlay"></div>
  <div class="bg-gradient-glow"></div>

  <div class="admin-header">
    <div class="header-logo-container">
      <img src="/img/logo-locket.png" alt="Locket Logo" class="header-logo">
    </div>
    <div class="header-badge">
      <span>🔔</span>
      Admin CAO VĂN NAM 🐱
    </div>
    <div class="admin-title">QUẢN LÝ WHITELIST LOCKET GOLD</div>
  </div>

  <div class="nav-links">
    <a href="/gold.html" target="_blank" class="nav-btn">🚀 Mở Cổng Kích Gold (Khách) ›</a>
    <a href="/hoangnam.html" class="nav-btn">⚙️ Tạo Mobileconfig 10s ›</a>
  </div>

  <!-- Box Thêm Khách -->
  <div class="container">
    <h2>➕ Thêm Khách Vào Danh Sách Duyệt</h2>

    <div class="input-row">
      <input id="addUsername" placeholder="Nhập username Locket (vd: nam2005)..." autocomplete="off" spellcheck="false" />
    </div>
    <div class="input-row">
      <input id="addNote" placeholder="Ghi chú (vd: Gói Gold 1 năm / VIP)..." autocomplete="off" />
    </div>

    <button id="addBtn" class="btn-primary" onclick="handleAddWhitelist()">🚀 Duyệt Quyền Cho Khách Hàng</button>
  </div>

  <!-- Box Danh Sách -->
  <div class="list-container">
    <div class="stats-row">
      <div class="stat-card">
        <div id="statTotal" class="stat-number">0</div>
        <div class="stat-label">Tổng Khách</div>
      </div>
      <div class="stat-card">
        <div id="statPending" class="stat-number" style="color: #d97706;">0</div>
        <div class="stat-label">Chờ Kích</div>
      </div>
      <div class="stat-card">
        <div id="statActivated" class="stat-number" style="color: #10b981;">0</div>
        <div class="stat-label">Đã Lên Gold</div>
      </div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
      <h2 style="margin: 0; text-align: left; font-size: 16px;">📋 Danh Sách Whitelist (KV Cloud)</h2>
      <button onclick="loadWhitelist()" class="btn-success btn-xs" style="padding: 6px 12px;">🔄 Tải lại</button>
    </div>

    <div id="whitelistItems">
      <div style="text-align: center; padding: 25px; color: var(--text-muted);">
        ⏳ Đang tải dữ liệu từ KV Cloud...
      </div>
    </div>
  </div>

  <script>
    const API_BASE = (location.hostname === '127.0.0.1' || location.hostname === 'localhost') 
      ? 'https://lkhoangnem.vercel.app' 
      : '';

    document.addEventListener('DOMContentLoaded', loadWhitelist);

    async function safeFetchJson(url, options = {}) {
      const res = await fetch(API_BASE + url, options);
      const text = await res.text();
      let data;
      try {
        data = JSON.parse(text);
      } catch (e) {
        throw new Error(text && text.length < 150 ? text : `Lỗi máy chủ (HTTP ${res.status})`);
      }
      if (!res.ok) {
        throw new Error(data.error || `Lỗi yêu cầu (HTTP ${res.status})`);
      }
      return data;
    }

    async function loadWhitelist() {
      const container = document.getElementById('whitelistItems');
      try {
        const data = await safeFetchJson('/api/whitelist');
        const list = data.list || [];
        renderList(list);
      } catch (err) {
        container.innerHTML = `<div style="text-align: center; padding: 20px; color: var(--danger); font-weight: 700;">❌ Lỗi: ${err.message}</div>`;
      }
    }

    function renderList(list) {
      const container = document.getElementById('whitelistItems');
      const statTotal = document.getElementById('statTotal');
      const statPending = document.getElementById('statPending');
      const statActivated = document.getElementById('statActivated');

      statTotal.innerText = list.length;
      statPending.innerText = list.filter(i => i.status !== 'activated').length;
      statActivated.innerText = list.filter(i => i.status === 'activated').length;

      if (list.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 30px 0; color: var(--text-muted);">
            <div style="font-size: 36px; margin-bottom: 8px;">📭</div>
            Chưa có khách nào trong Whitelist
          </div>`;
        return;
      }

      container.innerHTML = '';
      list.forEach(item => {
        const isActivated = item.status === 'activated';
        const badgeClass = isActivated ? 'badge-activated' : 'badge-pending';
        const badgeText = isActivated ? '🟢 Đã Kích Gold' : '🟡 Chờ Khách Kích';
        const timeText = isActivated ? (item.activatedAt || item.addedAt) : item.addedAt;

        container.innerHTML += `
          <div class="whitelist-item ${isActivated ? 'activated' : ''}">
            <div class="item-header">
              <div class="user-info-col">
                <img src="${item.avatar || '/img/logo-locket.png'}" class="user-avatar-mini" alt="Avatar">
                <div>
                  <div class="user-name-title">${item.name || item.username}</div>
                  <div class="user-username-tag">@${item.username} • <span style="color: var(--text-muted); font-size: 11px;">${item.note || 'Khách VIP'}</span></div>
                </div>
              </div>
              <span class="badge-status ${badgeClass}">${badgeText}</span>
            </div>

            <div class="item-footer">
              <div>⏱️ ${timeText || 'Vừa thêm'}</div>
              <div class="item-actions">
                ${!isActivated ? `<button onclick="forceKick('${item.username}')" class="btn-primary btn-xs">⚡ Kích Ngay</button>` : ''}
                <button onclick="copyCustomerLink('${item.username}')" class="btn-success btn-xs">📋 Link</button>
                <button onclick="deleteWhitelist('${item.username}')" class="btn-danger btn-xs">🗑️ Xóa</button>
              </div>
            </div>
          </div>
        `;
      });
    }

    function extractUsername(raw) {
      if (!raw) return '';
      let str = String(raw).trim();

      // 1. Tìm đường dẫn locket.cam/<username>
      const linkMatch = str.match(/locket\.cam\/([a-zA-Z0-9_.-]+)/i);
      if (linkMatch && linkMatch[1]) {
        return linkMatch[1].replace(/[?#].*$/, '').toLowerCase().trim();
      }

      // 2. Tìm theo @username
      const atMatch = str.match(/@([a-zA-Z0-9_.-]+)/);
      if (atMatch && atMatch[1]) {
        return atMatch[1].toLowerCase().trim();
      }

      // 3. Chuỗi đơn / làm sạch
      let clean = str.replace(/https?:\/\//gi, '').replace(/^@/, '').trim();
      const wordMatch = clean.match(/[a-zA-Z0-9_.-]+/);
      return wordMatch ? wordMatch[0].toLowerCase() : clean.toLowerCase();
    }

    // Tự động làm sạch input khi admin paste link
    document.getElementById('addUsername').addEventListener('change', (e) => {
      const clean = extractUsername(e.target.value);
      if (clean) e.target.value = clean;
    });

    async function handleAddWhitelist() {
      const userInput = document.getElementById('addUsername');
      const noteInput = document.getElementById('addNote');
      const btn = document.getElementById('addBtn');

      const username = extractUsername(userInput.value);
      const note = noteInput.value.trim() || 'Khách VIP';

      if (!username) {
        alert('Vui lòng nhập Username hoặc Link Locket!');
        userInput.focus();
        return;
      }

      userInput.value = username;
      btn.innerHTML = '⏳ Đang thêm vào Whitelist...';
      btn.disabled = true;

      try {
        const data = await safeFetchJson('/api/whitelist', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, note })
        });

        alert(`✅ Đã thêm @${username} vào danh sách Whitelist thành công!`);
        userInput.value = '';
        noteInput.value = '';
        loadWhitelist();

      } catch (err) {
        alert('❌ Lỗi: ' + err.message);
      } finally {
        btn.innerHTML = '🚀 Duyệt Quyền Cho Khách Hàng';
        btn.disabled = false;
      }
    }

    async function forceKick(username) {
      if (!confirm(`Bạn có chắc muốn kích hoạt Gold ngay cho @${username}?`)) return;

      try {
        const data = await safeFetchJson('/api/kick', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, forceAdmin: true })
        });

        alert(`🎉 Kích Gold thành công cho @${username} (${data.name})!`);
        if (window.confetti) {
          confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        }
        loadWhitelist();

      } catch (err) {
        alert('❌ Lỗi: ' + err.message);
      }
    }

    function copyCustomerLink(username) {
      const origin = (location.hostname === '127.0.0.1' || location.hostname === 'localhost') ? 'https://lkhoangnem.vercel.app' : location.origin;
      const link = `${origin}/gold.html`;
      const msg = `🔔 Xin chào bạn!\n✨ Tài khoản @${username} đã được Admin CAO VĂN NAM cấp quyền kích Locket Gold VIP.\n👉 Bạn hãy truy cập vào web sau và bấm kích hoạt nhé:\n${link}\n\nChúc bạn có trải nghiệm tuyệt vời cùng Locket Gold! 🔔✨`;

      navigator.clipboard.writeText(msg).then(() => {
        alert('✅ Đã copy tin nhắn kèm link gửi khách!');
      }).catch(() => {
        alert('Link kích: ' + link);
      });
    }

    async function deleteWhitelist(username) {
      if (!confirm(`⚠️ Bạn có chắc muốn xóa @${username} khỏi danh sách Whitelist?`)) return;

      try {
        await safeFetchJson('/api/whitelist', {
          method: 'DELETE',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username })
        });

        loadWhitelist();
      } catch (err) {
        alert('❌ Lỗi: ' + err.message);
      }
    }
  </script>
</body>
</html>
